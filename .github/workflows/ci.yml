name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build all binaries
        run: |
          mkdir -p dist
          for name in server signin login credit trial; do
            echo "::group::go build ./cmd/$name"
            CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/$name" "./cmd/$name"
            echo "::endgroup::"
          done

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.go-version }}
          path: dist/
          if-no-files-found: error
